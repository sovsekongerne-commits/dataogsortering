<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktiv Knap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Brugerdefinerede stilarter for 3D-effekt og animation */
        .perspective {
            perspective: 1000px;
        }
        .flip-card {
            transition: transform 0.3s ease-out; /* Animation for svæve-effekt */
        }
        /* Svæve-effekten håndteres nu af JavaScript for at tillade tilfældighed */
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s ease-in-out; /* Hurtigere animation */
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(1980deg); /* Drejer 5.5 gange for at lande på bagsiden */
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; /* Safari */
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 1.5rem; /* afrundede hjørner */
            font-size: 5rem;
            font-family: 'Arial', sans-serif;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .flip-card-front span, .flip-card-back span {
             transition: filter 0.2s linear; /* Gør overgangen til sløring jævn */
        }
        .flip-card.blurring .flip-card-front span,
        .flip-card.blurring .flip-card-back span {
            filter: blur(4px); /* Motion blur effekt */
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-[#DEEBD7] min-h-screen flex items-center justify-center font-sans">

    <div id="interactiveButton" class="flip-card w-48 h-48 sm:w-64 sm:h-64 perspective">
        <div class="flip-card-inner">
            <div class="flip-card-front bg-[#CFE0F3] text-[#29619F]">
                <span>?</span>
            </div>
            <div class="flip-card-back bg-[#FFF5C3] text-yellow-600">
                <span>🐱</span>
            </div>
        </div>
    </div>

    <script>
        const button = document.getElementById('interactiveButton');
        let isAnimating = false; // Forhindrer klik under animation

        // Håndterer svæve-effekt med tilfældig rotation
        button.addEventListener('mouseenter', () => {
            if (isAnimating) return;

            // Generer tilfældige værdier for en mere dynamisk effekt
            const randomAngle = Math.random() * 20 - 10; // Tilfældig vinkel mellem -10 og 10 grader
            const randomY = -(Math.random() * 10 + 10);   // Tilfældigt løft mellem -10px og -20px

            button.style.transform = `translateY(${randomY}px) scale(1.05) rotate(${randomAngle}deg)`;
        });

        // Nulstiller effekten når musen fjernes
        button.addEventListener('mouseleave', () => {
            button.style.transform = 'none';
        });

        button.addEventListener('click', () => {
            // Gør intet hvis animationen allerede er i gang
            if (isAnimating) {
                return;
            }
            
            isAnimating = true;

            // Tilføj en klasse for motion blur effekt
            button.classList.add('blurring');

            // Skift mellem for- og bagside
            button.classList.toggle('flipped');

            // Fjern blur og tillad klik igen når animationen er færdig
            setTimeout(() => {
                button.classList.remove('blurring');
                isAnimating = false;
            }, 800); // Skal matche transition-tiden i CSS
        });
    </script>

</body>
</html>
