<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data & Sortering - Kongskole.dk</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Fredoka', sans-serif;
        background-color: #f0fdf4; /* Light green/playful background */
      }
      .font-lato {
        font-family: 'Lato', sans-serif;
      }
      .font-fredoka {
        font-family: 'Fredoka', sans-serif;
      }
      /* Disable text selection to make dragging easier */
      .no-select {
        user-select: none;
        -webkit-user-select: none;
      }
      /* Custom cursors sized exactly like standard Windows cursors (16px) but with black outline */
      .cursor-grab, .cursor-grabbing, .active\:cursor-grabbing:active {
        cursor: url('data:image/svg+xml;utf8,<svg width="24" height="24" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg"><g fill="white" stroke="black" stroke-linecap="round" stroke-linejoin="round" transform="translate(5 6)"><path d="m2.35073766 3.50548574.14926234-.00548574v-1c0-.55228475.44771525-1 1-1s1 .44771525 1 1v-1c0-.55228475.44771525-1 1-1s1 .44771525 1 1v1c0-.55228475.44771525-1 1-1s1 .44771525 1 1v1c0-.55228475.44771525-1 1-1 .5522847 0 1 .44771525 1 1v4c0 2.7614237-2.23857625 5-5 5h-.5c-2.48528137 0-4.5-2.0147186-4.5-4.5v-2.5c0-1.0543618.81587779-1.91816512 1.85073766-1.99451426z"/><path d="m2.5 2.5v3"/><path d="m4.5 1.5v2"/><path d="m6.5 1.5v2"/><path d="m8.5 2.5v2"/></g></svg>') 10 10, grab !important;
      }
      
      @media print {
        @page {
          size: A4;
          margin: 0;
        }
        /* Skjul hele UI-sidebar og knapper */
        .worksheet-sidebar, .floating-print-btn, .no-print {
          display: none !important;
        }
        html, body, #root, .worksheet-main-container, .worksheet-preview-pane {
          background: #ffffff !important;
          margin: 0 !important;
          padding: 0 !important;
          height: auto !important;
          min-height: auto !important;
          overflow: visible !important;
          display: block !important;
        }
        /* Præcis A4 dimensionsstyring */
        .a4-page, .forside-page {
          width: 210mm !important;
          height: 297mm !important;
          min-height: 297mm !important;
          max-height: 297mm !important;
          margin: 0 !important;
          padding: 15mm !important;
          page-break-after: always !important;
          page-break-inside: avoid !important;
          background: #ffffff !important;
          border: none !important;
          box-shadow: none !important;
          zoom: 1 !important;
        }
        .a4-page:last-child, .forside-page:last-child {
          page-break-after: auto !important;
        }
        /* Bevar farver og baggrunde ved print */
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        .text-print {
          color: #000000 !important;
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
